
name: CloudForge CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run API tests
        run: python -m unittest discover -s tests -v

  sonarcloud:
    name: SonarQube Cloud Analysis
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install coverage

      - name: Run tests with coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage xml -o coverage.xml

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-and-push:
    name: Build, Scan and Push Image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f docker/Dockerfile.api \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:latest" \
            -t "${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:${{ github.sha }}" \
            .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:${{ github.sha }}
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image tags
        run: |
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:latest"
          docker push "${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:${{ github.sha }}"

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: self-hosted

    steps:
      - name: Deploy new image
        run: |
          kubectl set image deployment/cloudforge-api \
            api=${{ secrets.DOCKERHUB_USERNAME }}/cloudforge-api:${{ github.sha }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/cloudforge-api --timeout=120s
